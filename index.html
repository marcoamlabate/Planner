<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
  <title>ADHD Planner</title>
  <link rel="icon" type="image/png" href="./icon.png" />
  <link rel="apple-touch-icon" href="./icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ADHD Planner" />
  <meta name="theme-color" content="#111115" />
  <style>
    * { box-sizing: border-box; }
    :root { --sat: env(safe-area-inset-top, 0px); --sar: env(safe-area-inset-right, 0px); --sab: env(safe-area-inset-bottom, 0px); --sal: env(safe-area-inset-left, 0px); }
    html, body, #root { margin: 0; width: 100%; min-height: 100%; }
    html, body { background: #111115; overflow: hidden; }
    body {
      overscroll-behavior: none;
      font-family: -apple-system, BlinkMacSystemFont, 'IBM Plex Mono', monospace;
      padding-top: var(--sat);
      padding-right: var(--sar);
      padding-bottom: var(--sab);
      padding-left: var(--sal);
    }
    button, input, textarea, select { font: inherit; }
    #root { height: calc(100dvh - var(--sat) - var(--sab)); }
    #boot-error { color: #E8E8F0; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, sans-serif; display:none; }
  </style>
  <script>
    window.addEventListener('error', function(e) {
      var el = document.getElementById('boot-error');
      if (el) { el.style.display = 'block'; el.textContent = 'App failed to start: ' + (e.message || 'Unknown error'); }
      console.error(e.error || e.message);
    });
  </script>
</head>
<body>
  <div id="root"></div>
  <div id="boot-error"></div>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.warn));
    }
  </script>
</body>
</html>
