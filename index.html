  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-presets="env,react,typescript">
const { useState, useRef, useEffect, useMemo } = React;

const C = {
  bg0: "#0A0A0C", bg1: "#111115", bg2: "#18181F", bg3: "#22222C", bg4: "#2C2C38",
  border: "#2E2E3A", accent: "#00C2FF", accentD: "#0090CC",
  green: "#1EDF80", amber: "#F5A623", red: "#FF4444",
  text: "#E8E8F0", muted: "#6B6B80", dim: "#3A3A48",
};
const ACCENT_COLORS = ["#00C2FF","#1EDF80","#F5A623","#FF4444","#A78BFA","#F97316","#06B6D4","#84CC16"];
const PRIORITY: Record<string, { label: string; icon: string; color: string; bg: string }> = {
  high:   { label: "HIGH", icon: "▲", color: C.red,   bg: "#FF44441A" },
  medium: { label: "MED",  icon: "●", color: C.amber, bg: "#F5A6231A" },
  low:    { label: "LOW",  icon: "▼", color: C.green, bg: "#1EDF801A" },
};
const DAYS_S = ["S","M","T","W","T","F","S"];
const DAYS_L = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
const MONTHS = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];

interface Subtask { id: number; text: string; done: boolean; }
interface Task {
  id: number; text: string; description: string; priority: string;
  done: boolean; categoryId: string; imageUrl: string;
  dueDate: string; subtasks: Subtask[];
}
interface Category { id: string; name: string; color: string; }
interface Appt {
  id: number; title: string; date: string; time: string; color: string;
  description: string; imageUrl: string;
  recurrence: "none" | "daily" | "weekly" | "monthly";
}
interface Note {
  id: number; title: string; type: "descriptive" | "topic";
  content: string; topics: string[]; folderId: string; imageUrl: string; createdAt: number;
}
interface Folder { id: string; name: string; color: string; }

function useLocalState<T>(key: string, init: T): [T, React.Dispatch<React.SetStateAction<T>>] {
  const [val, setVal] = useState<T>(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; }
    catch { return init; }
  });
  useEffect(() => { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }, [key, val]);
  return [val, setVal];
}
function useWindowWidth() {
  const [w, setW] = useState(typeof window !== "undefined" ? window.innerWidth : 390);
  useEffect(() => {
    const h = () => setW(window.innerWidth);
    window.addEventListener("resize", h);
    return () => window.removeEventListener("resize", h);
  }, []);
  return w;
}
function getDaysInMonth(y: number, m: number) { return new Date(y, m + 1, 0).getDate(); }
function getFirstDay(y: number, m: number) { return new Date(y, m, 1).getDay(); }
function todayStr() { return new Date().toISOString().split("T")[0]; }
function readImageFile(file: File): Promise<string> {
  return new Promise(r => { const fr = new FileReader(); fr.onload = e => r((e.target?.result as string) ?? ""); fr.readAsDataURL(file); });
}
function getOccurrencesForMonth(appts: Appt[], year: number, month: number): Record<number, Appt[]> {
  const res: Record<number, Appt[]> = {};
  const dim = getDaysInMonth(year, month);
  const add = (day: number, a: Appt) => { if (!res[day]) res[day] = []; if (!res[day].find(x => x.id === a.id)) res[day].push(a); };
  for (const a of appts) {
    if (!a.date) continue;
    const orig = new Date(a.date + "T12:00:00");
    if (orig.getFullYear() === year && orig.getMonth() === month) add(orig.getDate(), a);
    if (a.recurrence === "none") continue;
    const thisYM = year * 12 + month, origYM = orig.getFullYear() * 12 + orig.getMonth();
    if (a.recurrence === "daily" && thisYM >= origYM) {
      for (let d = 1; d <= dim; d++) { if (new Date(year, month, d) > orig) add(d, a); }
    } else if (a.recurrence === "weekly" && thisYM >= origYM) {
      const dow = orig.getDay();
      for (let d = 1; d <= dim; d++) { const dt = new Date(year, month, d); if (dt.getDay() === dow && dt > orig) add(d, a); }
    } else if (a.recurrence === "monthly" && thisYM > origYM) {
      const day = orig.getDate(); if (day <= dim) add(day, a);
    }
  }
  return res;
}
function getWeekStart(): Date {
  const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return d;
}

const inp: React.CSSProperties = {
  width: "100%", background: C.bg3, border: `1px solid ${C.border}`,
  borderRadius: 10, padding: "10px 14px", fontSize: 13,
  fontFamily: "'IBM Plex Mono', monospace", color: C.text, outline: "none", boxSizing: "border-box",
};
const DEFAULT_CATEGORIES: Category[] = [
  { id: "personal", name: "Personal", color: "#A78BFA" },
  { id: "work",     name: "Work",     color: "#F97316" },
  { id: "college",  name: "College",  color: "#06B6D4" },
];
const DEFAULT_FOLDERS: Folder[] = [{ id: "general", name: "General", color: "#00C2FF" }];

function ImageUploadBtn({ value, onChange }: { value: string; onChange: (u: string) => void }) {
  const ref = useRef<HTMLInputElement>(null);
  return (
    <div style={{ marginBottom: 10 }}>
      <input ref={ref} type="file" accept="image/*" style={{ display: "none" }}
        onChange={async e => { const f = e.target.files?.[0]; if (f) onChange(await readImageFile(f)); }} />
      {value ? (
        <div style={{ position: "relative", display: "inline-block" }}>
          <img src={value} alt="" style={{ maxWidth: "100%", borderRadius: 10, maxHeight: 150, objectFit: "cover", display: "block" }} />
          <button onClick={() => onChange("")} style={{ position: "absolute", top: 4, right: 4, background: "#00000088", border: "none", borderRadius: 6, width: 24, height: 24, cursor: "pointer", color: C.red, fontWeight: 700, fontSize: 14 }}>×</button>
        </div>
      ) : (
        <button onClick={() => ref.current?.click()} style={{ padding: "7px 12px", borderRadius: 8, border: `1px dashed ${C.dim}`, background: "transparent", cursor: "pointer", color: C.muted, fontSize: 10, fontFamily: "inherit", fontWeight: 700, letterSpacing: 1 }}>+ ADD IMAGE</button>
      )}
    </div>
  );
}
function CatPill({ label, active, color, onClick }: { label: string; active: boolean; color: string; onClick: () => void }) {
  return <button onClick={onClick} style={{ padding: "4px 10px", borderRadius: 20, border: "none", cursor: "pointer", background: active ? color : C.bg3, color: active ? C.bg0 : color, fontWeight: 700, fontSize: 9, fontFamily: "inherit", letterSpacing: 1 }}>{label}</button>;
}
function SectionHeader({ icon, label, color }: { icon: string; label: string; color: string }) {
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 9, fontWeight: 700, letterSpacing: 3, color, marginBottom: 8 }}>
      <span>{icon}</span><span>{label}</span><div style={{ flex: 1, height: 1, background: color + "33" }} />
    </div>
  );
}

function TaskCard({ task, categories, onToggle, onDelete, onEdit, onToggleSubtask, onAddSubtask }: {
  task: Task; categories: Category[];
  onToggle: (id: number) => void; onDelete: (id: number) => void; onEdit: (t: Task) => void;
  onToggleSubtask: (taskId: number, subId: number) => void;
  onAddSubtask: (taskId: number, text: string) => void;
}) {
  const [expanded, setExpanded] = useState(false);
  const [newSub, setNewSub] = useState("");
  const p = PRIORITY[task.priority];
  const cat = categories.find(c => c.id === task.categoryId);
  const subs = task.subtasks ?? [];
  const subDone = subs.filter(s => s.done).length;
  const isOverdue = !task.done && task.dueDate && task.dueDate < todayStr();
  const hasExtra = !!(task.description || task.imageUrl || subs.length);

  return (
    <div style={{ background: C.bg2, borderRadius: 12, padding: "12px 14px", marginBottom: 6, border: `1px solid ${C.border}`, borderLeft: task.done ? `2px solid ${C.dim}` : isOverdue ? `2px solid ${C.red}` : `2px solid ${p.color}`, opacity: task.done ? 0.45 : 1, transition: "opacity 0.3s" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <button onClick={() => onToggle(task.id)} style={{ width: 22, height: 22, borderRadius: 6, border: task.done ? "none" : `1px solid ${isOverdue ? C.red : p.color}66`, background: task.done ? C.green : "transparent", cursor: "pointer", fontSize: 11, flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", color: C.bg0, fontWeight: 800, boxShadow: task.done ? `0 0 8px ${C.green}55` : "none" }}>{task.done ? "✓" : ""}</button>
        <div style={{ flex: 1, cursor: "pointer" }} onClick={() => hasExtra && setExpanded(!expanded)}>
          <div style={{ fontSize: 13, fontWeight: 600, color: task.done ? C.muted : C.text, textDecoration: task.done ? "line-through" : "none", letterSpacing: 0.3 }}>{task.text}</div>
          <div style={{ display: "flex", gap: 6, marginTop: 3, alignItems: "center", flexWrap: "wrap" }}>
            {!task.done && <span style={{ fontSize: 9, fontWeight: 700, color: isOverdue ? C.red : p.color, letterSpacing: 2 }}>{isOverdue ? "⚠ OVERDUE" : `${p.icon} ${p.label}`}</span>}
            {cat && <span style={{ fontSize: 9, fontWeight: 700, color: cat.color, background: cat.color + "18", padding: "1px 6px", borderRadius: 10, letterSpacing: 1 }}>{cat.name}</span>}
            {task.dueDate && !task.done && <span style={{ fontSize: 9, color: isOverdue ? C.red : C.muted, letterSpacing: 1 }}>📅 {task.dueDate}</span>}
            {subs.length > 0 && <span style={{ fontSize: 9, color: subDone === subs.length ? C.green : C.muted, letterSpacing: 1 }}>☑ {subDone}/{subs.length}</span>}
            {hasExtra && <span style={{ fontSize: 9, color: C.dim }}>{expanded ? "▲" : "▼"}</span>}
          </div>
        </div>
        <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
          <button onClick={() => onEdit(task)} style={{ background: C.bg3, border: "none", borderRadius: 6, width: 26, height: 26, cursor: "pointer", color: C.muted, fontWeight: 700, fontSize: 11 }}>✎</button>
          <button onClick={() => onDelete(task.id)} style={{ background: "#FF44441A", border: "none", borderRadius: 6, width: 26, height: 26, cursor: "pointer", color: C.red, fontWeight: 700, fontSize: 13 }}>×</button>
        </div>
      </div>
      {expanded && (
        <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.border}` }}>
          {task.description && <div style={{ fontSize: 12, color: C.muted, lineHeight: 1.6, marginBottom: 8 }}>{task.description}</div>}
          {task.imageUrl && <img src={task.imageUrl} alt="" style={{ maxWidth: "100%", borderRadius: 8, maxHeight: 160, objectFit: "cover", display: "block", marginBottom: 10 }} />}
          {subs.length > 0 && (
            <div style={{ marginBottom: 8 }}>
              {subs.map(s => (
                <div key={s.id} style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 5 }}>
                  <button onClick={() => onToggleSubtask(task.id, s.id)} style={{ width: 18, height: 18, borderRadius: 4, border: s.done ? "none" : `1px solid ${C.dim}`, background: s.done ? C.green : "transparent", cursor: "pointer", flexShrink: 0, display: "flex", alignItems: "center", justifyContent: "center", color: C.bg0, fontWeight: 700, fontSize: 10 }}>{s.done ? "✓" : ""}</button>
                  <span style={{ fontSize: 12, color: s.done ? C.dim : C.muted, textDecoration: s.done ? "line-through" : "none" }}>{s.text}</span>
                </div>
              ))}
            </div>
          )}
          <div style={{ display: "flex", gap: 6 }}>
            <input placeholder="Add subtask..." value={newSub} onChange={e => setNewSub(e.target.value)}
              onKeyDown={e => { if (e.key === "Enter" && newSub.trim()) { onAddSubtask(task.id, newSub.trim()); setNewSub(""); } }}
              style={{ ...inp, flex: 1, padding: "6px 10px", fontSize: 11 }} />
            <button onClick={() => { if (newSub.trim()) { onAddSubtask(task.id, newSub.trim()); setNewSub(""); } }} style={{ padding: "6px 10px", borderRadius: 8, border: "none", background: C.accent, color: C.bg0, fontWeight: 700, fontSize: 11, cursor: "pointer", fontFamily: "inherit" }}>+</button>
          </div>
        </div>
      )}
    </div>
  );
}

function ApptCard({ appt, onDelete, onEdit }: { appt: Appt; onDelete: (id: number) => void; onEdit: (a: Appt) => void }) {
  const [expanded, setExpanded] = useState(false);
  const d = new Date(appt.date + "T12:00:00");
  const hasExtra = !!(appt.description || appt.imageUrl);
  const recurLabel: Record<string, string> = { daily: "↺ DAILY", weekly: "↺ WEEKLY", monthly: "↺ MONTHLY" };
  return (
    <div style={{ background: C.bg2, borderRadius: 12, padding: "12px 14px", marginBottom: 8, border: `1px solid ${C.border}`, borderLeft: `2px solid ${appt.color}` }}>
      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
        <div style={{ background: appt.color + "18", borderRadius: 8, padding: "6px 8px", textAlign: "center", minWidth: 38, flexShrink: 0, cursor: hasExtra ? "pointer" : "default" }} onClick={() => hasExtra && setExpanded(!expanded)}>
          <div style={{ fontSize: 8, fontWeight: 700, color: appt.color, letterSpacing: 1 }}>{MONTHS[d.getMonth()]}</div>
          <div style={{ fontSize: 20, fontWeight: 900, color: appt.color, lineHeight: 1.1 }}>{d.getDate()}</div>
        </div>
        <div style={{ flex: 1, cursor: hasExtra ? "pointer" : "default" }} onClick={() => hasExtra && setExpanded(!expanded)}>
          <div style={{ fontWeight: 700, fontSize: 13, color: C.text }}>{appt.title}</div>
          <div style={{ display: "flex", gap: 6, marginTop: 2, flexWrap: "wrap", alignItems: "center" }}>
            {appt.time && <span style={{ fontSize: 10, color: C.muted, letterSpacing: 1 }}>{appt.time}</span>}
            {appt.recurrence !== "none" && <span style={{ fontSize: 9, color: appt.color, fontWeight: 700, letterSpacing: 1 }}>{recurLabel[appt.recurrence]}</span>}
            {hasExtra && <span style={{ fontSize: 9, color: C.dim }}>{expanded ? "▲ less" : "▼ more"}</span>}
          </div>
        </div>
        <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
          <button onClick={() => onEdit(appt)} style={{ background: C.bg3, border: "none", borderRadius: 6, width: 26, height: 26, cursor: "pointer", color: C.muted, fontWeight: 700, fontSize: 11 }}>✎</button>
          <button onClick={() => onDelete(appt.id)} style={{ background: "#FF44441A", border: "none", borderRadius: 6, width: 26, height: 26, cursor: "pointer", color: C.red, fontWeight: 700, fontSize: 13 }}>×</button>
        </div>
      </div>
      {expanded && hasExtra && (
        <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${C.border}` }}>
          {appt.description && <div style={{ fontSize: 12, color: C.muted, lineHeight: 1.6, marginBottom: appt.imageUrl ? 8 : 0 }}>{appt.description}</div>}
          {appt.imageUrl && <img src={appt.imageUrl} alt="" style={{ maxWidth: "100%", borderRadius: 8, maxHeight: 160, objectFit: "cover", display: "block" }} />}
        </div>
      )}
    </div>
  );
}

function QuickCapture({ categories, folders, onAddTask, onAddNote, onClose, fixed }: {
  categories: Category[]; folders: Folder[];
  onAddTask: (text: string, categoryId: string) => void;
  onAddNote: (title: string, folderId: string) => void;
  onClose: () => void; fixed?: boolean;
}) {
  const [text, setText] = useState("");
  const [type, setType] = useState<"task" | "note">("task");
  const [catId, setCatId] = useState(categories[0]?.id ?? "personal");
  const [folderId, setFolderId] = useState(folders[0]?.id ?? "general");
  const ref = useRef<HTMLInputElement>(null);
  useEffect(() => { setTimeout(() => ref.current?.focus(), 100); }, []);

  function save() {
    if (!text.trim()) return;
    if (type === "task") onAddTask(text.trim(), catId);
    else onAddNote(text.trim(), folderId);
    onClose();
  }

  return (
    <div style={{ position: fixed ? "fixed" : "absolute", inset: 0, background: "rgba(0,0,0,0.75)", zIndex: 300, display: "flex", alignItems: "flex-end" }} onClick={onClose}>
      <div style={{ width: "100%", background: C.bg2, borderRadius: "24px 24px 0 0", padding: "20px 16px 36px", border: `1px solid ${C.border}` }} onClick={e => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 3, color: C.accent }}>// QUICK CAPTURE</div>
          <button onClick={onClose} style={{ background: "none", border: "none", color: C.muted, fontSize: 18, cursor: "pointer", fontWeight: 700 }}>×</button>
        </div>
        <div style={{ display: "flex", gap: 4, marginBottom: 12, background: C.bg3, borderRadius: 10, padding: 3 }}>
          {([ ["task","⊡ TASK"], ["note","≡ NOTE"] ] as ["task"|"note", string][]).map(([k, l]) => (
            <button key={k} onClick={() => setType(k)} style={{ flex: 1, padding: "7px 0", borderRadius: 8, border: "none", cursor: "pointer", fontWeight: 700, fontSize: 10, letterSpacing: 1.5, fontFamily: "inherit", background: type === k ? C.accent : "transparent", color: type === k ? C.bg0 : C.muted }}>{l}</button>
          ))}
        </div>
        <input ref={ref} placeholder={type === "task" ? "What needs doing?" : "Note title..."} value={text}
          onChange={e => setText(e.target.value)} onKeyDown={e => e.key === "Enter" && save()}
          style={{ ...inp, marginBottom: 10 }} />
        <div style={{ display: "flex", gap: 6, marginBottom: 14, flexWrap: "wrap" }}>
          {type === "task"
            ? categories.map(c => <CatPill key={c.id} label={c.name.toUpperCase()} active={catId === c.id} color={c.color} onClick={() => setCatId(c.id)} />)
            : folders.map(f => <CatPill key={f.id} label={f.name.toUpperCase()} active={folderId === f.id} color={f.color} onClick={() => setFolderId(f.id)} />)
          }
        </div>
        <button onClick={save} style={{ width: "100%", padding: 12, borderRadius: 12, border: "none", background: C.accent, color: C.bg0, fontWeight: 700, fontSize: 12, cursor: "pointer", fontFamily: "inherit", letterSpacing: 1, boxShadow: `0 0 20px ${C.accent}55` }}>CAPTURE</button>
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const windowWidth = useWindowWidth();
  const isWide = windowWidth >= 640;

  const [tab, setTab] = useState("tasks");
  const [motivation, setMotivation] = useLocalState("adhd3_mot", "Lock in. Every task done is a win.");
  const [editMot, setEditMot] = useState(false);
  const [motDraft, setMotDraft] = useState("");
  const motRef = useRef<HTMLTextAreaElement>(null);
  const today = new Date();

  const [searchOpen, setSearchOpen] = useState(false);
  const [searchQuery, setSearchQuery] = useState("");
  const searchRef = useRef<HTMLInputElement>(null);
  const [showCapture, setShowCapture] = useState(false);

  const [rawTasks, setTasks] = useLocalState<any[]>("adhd3_tasks", []);
  const tasks: Task[] = rawTasks.map(t => ({ dueDate: "", subtasks: [], ...t }));
  const [categories, setCategories] = useLocalState<Category[]>("adhd3_cats", DEFAULT_CATEGORIES);
  const [taskCatFilter, setTaskCatFilter] = useState("all");
  const [showTaskForm, setShowTaskForm] = useState(false);
  const [editingTaskId, setEditingTaskId] = useState<number | null>(null);
  const [showCatMgr, setShowCatMgr] = useState(false);
  const [catDraft, setCatDraft] = useState({ name: "", color: ACCENT_COLORS[4] });
  const emptyTask = () => ({ text: "", description: "", priority: "medium", categoryId: categories[0]?.id ?? "personal", imageUrl: "", dueDate: "", subtasks: [] as Subtask[] });
  const [taskDraft, setTaskDraft] = useState(emptyTask);

  const [rawAppts, setAppts] = useLocalState<any[]>("adhd3_appts", []);
  const appts: Appt[] = rawAppts.map(a => ({ recurrence: "none", ...a }));
  const [calView, setCalView] = useState<"grid" | "week" | "list">("grid");
  const [calYear, setCalYear] = useState(today.getFullYear());
  const [calMonth, setCalMonth] = useState(today.getMonth());
  const [selDay, setSelDay] = useState<number | null>(null);
  const [weekStart, setWeekStart] = useState(getWeekStart);
  const [apptColorFilter, setApptColorFilter] = useState<Set<string>>(new Set());
  const [showApptForm, setShowApptForm] = useState(false);
  const [editingApptId, setEditingApptId] = useState<number | null>(null);
  const emptyAppt = () => ({ title: "", date: "", time: "", color: C.accent, description: "", imageUrl: "", recurrence: "none" as const });
  const [apptDraft, setApptDraft] = useState(emptyAppt);

  const [notes, setNotes] = useLocalState<Note[]>("adhd3_notes", []);
  const [folders, setFolders] = useLocalState<Folder[]>("adhd3_folders", DEFAULT_FOLDERS);
  const [selFolderId, setSelFolderId] = useState<string | null>(null);
  const [noteView, setNoteView] = useState<"list" | "edit">("list");
  const [editingNoteId, setEditingNoteId] = useState<number | null>(null);
  const [showFolderMgr, setShowFolderMgr] = useState(false);
  const [folderDraft, setFolderDraft] = useState({ name: "", color: ACCENT_COLORS[0] });
  const emptyNote = () => ({ title: "", type: "descriptive" as const, content: "", topics: [""], folderId: folders[0]?.id ?? "general", imageUrl: "" });
  const [noteDraft, setNoteDraft] = useState(emptyNote);

  function startEditMot() { setMotDraft(motivation); setEditMot(true); setTimeout(() => motRef.current?.focus(), 50); }
  function saveMot() { if (motDraft.trim()) setMotivation(motDraft.trim()); setEditMot(false); }

  useEffect(() => { if (searchOpen) setTimeout(() => searchRef.current?.focus(), 100); }, [searchOpen]);
  const searchResults = useMemo(() => {
    if (!searchQuery.trim()) return null;
    const q = searchQuery.toLowerCase();
    return {
      tasks: tasks.filter(t => t.text.toLowerCase().includes(q) || t.description?.toLowerCase().includes(q)),
      appts: appts.filter(a => a.title.toLowerCase().includes(q) || a.description?.toLowerCase().includes(q)),
      notes: notes.filter(n => n.title.toLowerCase().includes(q) || n.content?.toLowerCase().includes(q) || n.topics?.some(t => t.toLowerCase().includes(q))),
    };
  }, [searchQuery, rawTasks, rawAppts, notes]);

  function openAddTask() { setTaskDraft(emptyTask()); setEditingTaskId(null); setShowTaskForm(true); }
  function openEditTask(t: Task) {
    setTaskDraft({ text: t.text, description: t.description, priority: t.priority, categoryId: t.categoryId, imageUrl: t.imageUrl, dueDate: t.dueDate ?? "", subtasks: t.subtasks ?? [] });
    setEditingTaskId(t.id); setShowTaskForm(true);
  }
  function saveTask() {
    if (!taskDraft.text.trim()) return;
    if (editingTaskId !== null) setTasks((p: any[]) => p.map(t => t.id === editingTaskId ? { ...t, ...taskDraft } : t));
    else setTasks((p: any[]) => [...p, { id: Date.now(), done: false, ...taskDraft }]);
    setShowTaskForm(false); setEditingTaskId(null);
  }
  function toggleTask(id: number) { setTasks((p: any[]) => p.map(t => t.id === id ? { ...t, done: !t.done } : t)); }
  function deleteTask(id: number) { setTasks((p: any[]) => p.filter(t => t.id !== id)); }
  function toggleSubtask(taskId: number, subId: number) {
    setTasks((p: any[]) => p.map(t => t.id === taskId ? { ...t, subtasks: (t.subtasks ?? []).map((s: Subtask) => s.id === subId ? { ...s, done: !s.done } : s) } : t));
  }
  function addSubtask(taskId: number, text: string) {
    setTasks((p: any[]) => p.map(t => t.id === taskId ? { ...t, subtasks: [...(t.subtasks ?? []), { id: Date.now(), text, done: false }] } : t));
  }
  function addSubtaskToDraft() { setTaskDraft(d => ({ ...d, subtasks: [...d.subtasks, { id: Date.now(), text: "", done: false }] })); }
  function removeSubtaskFromDraft(id: number) { setTaskDraft(d => ({ ...d, subtasks: d.subtasks.filter(s => s.id !== id) })); }
  function updateSubtaskInDraft(id: number, text: string) { setTaskDraft(d => ({ ...d, subtasks: d.subtasks.map(s => s.id === id ? { ...s, text } : s) })); }
  function addCategory() {
    if (!catDraft.name.trim()) return;
    setCategories(p => [...p, { id: Date.now().toString(), name: catDraft.name.trim(), color: catDraft.color }]);
    setCatDraft({ name: "", color: ACCENT_COLORS[4] });
  }
  function deleteCategory(id: string) {
    setCategories(p => p.filter(c => c.id !== id));
    setTasks((p: any[]) => p.map(t => t.categoryId === id ? { ...t, categoryId: categories[0]?.id ?? "personal" } : t));
  }
  function quickAddTask(text: string, categoryId: string) {
    setTasks((p: any[]) => [...p, { id: Date.now(), text, description: "", priority: "medium", done: false, categoryId, imageUrl: "", dueDate: "", subtasks: [] }]);
  }
  function openAddAppt() { setApptDraft(emptyAppt()); setEditingApptId(null); setShowApptForm(true); }
  function openEditAppt(a: Appt) {
    setApptDraft({ title: a.title, date: a.date, time: a.time, color: a.color, description: a.description, imageUrl: a.imageUrl, recurrence: a.recurrence ?? "none" });
    setEditingApptId(a.id); setShowApptForm(true);
  }
  function saveAppt() {
    if (!apptDraft.title.trim() || !apptDraft.date) return;
    if (editingApptId !== null) setAppts((p: any[]) => p.map(a => a.id === editingApptId ? { ...a, ...apptDraft } : a));
    else setAppts((p: any[]) => [...p, { id: Date.now(), ...apptDraft }]);
    setShowApptForm(false); setEditingApptId(null);
  }
  function deleteAppt(id: number) { setAppts((p: any[]) => p.filter(a => a.id !== id)); }
  function toggleColorFilter(c: string) { setApptColorFilter(prev => { const n = new Set(prev); n.has(c) ? n.delete(c) : n.add(c); return n; }); }
  const filteredAppts = apptColorFilter.size === 0 ? appts : appts.filter(a => apptColorFilter.has(a.color));
  function openAddNote() { setNoteDraft(emptyNote()); setEditingNoteId(null); setNoteView("edit"); }
  function openEditNote(n: Note) {
    setNoteDraft({ title: n.title, type: n.type, content: n.content, topics: n.topics.length ? n.topics : [""], folderId: n.folderId, imageUrl: n.imageUrl });
    setEditingNoteId(n.id); setNoteView("edit");
  }
  function saveNote() {
    if (!noteDraft.title.trim()) return;
    const now = Date.now(); const rec = { ...noteDraft, topics: noteDraft.topics.filter(t => t.trim()) };
    if (editingNoteId !== null) setNotes(p => p.map(n => n.id === editingNoteId ? { ...n, ...rec } : n));
    else setNotes(p => [...p, { id: now, createdAt: now, ...rec }]);
    setNoteView("list"); setEditingNoteId(null);
  }
  function deleteNote(id: number) { setNotes(p => p.filter(n => n.id !== id)); }
  function addFolder() {
    if (!folderDraft.name.trim()) return;
    setFolders(p => [...p, { id: Date.now().toString(), name: folderDraft.name.trim(), color: folderDraft.color }]);
    setFolderDraft({ name: "", color: ACCENT_COLORS[0] });
  }
  function deleteFolder(id: string) {
    const remaining = folders.filter(f => f.id !== id); const fallback = remaining[0]?.id ?? "general";
    setFolders(p => p.filter(f => f.id !== id));
    setNotes(p => p.map(n => n.folderId === id ? { ...n, folderId: fallback } : n));
  }
  function quickAddNote(title: string, folderId: string) {
    const now = Date.now();
    setNotes(p => [...p, { id: now, createdAt: now, title, type: "descriptive", content: "", topics: [], folderId, imageUrl: "" }]);
  }

  const daysInMonth = getDaysInMonth(calYear, calMonth);
  const firstDay = getFirstDay(calYear, calMonth);
  const apptsByDay = useMemo(() => getOccurrencesForMonth(appts, calYear, calMonth), [rawAppts, calYear, calMonth]);
  function prevMonth() { if (calMonth === 0) { setCalMonth(11); setCalYear(y => y - 1); } else setCalMonth(m => m - 1); setSelDay(null); }
  function nextMonth() { if (calMonth === 11) { setCalMonth(0); setCalYear(y => y + 1); } else setCalMonth(m => m + 1); setSelDay(null); }
  const weekDays = useMemo(() => Array.from({ length: 7 }, (_, i) => { const d = new Date(weekStart); d.setDate(d.getDate() + i); return d; }), [weekStart]);
  const [selWeekDay, setSelWeekDay] = useState<Date | null>(null);
  const weekApptsByDay = useMemo(() => {
    const res: Record<string, Appt[]> = {};
    for (const appt of appts) {
      if (!appt.date) continue;
      const orig = new Date(appt.date + "T12:00:00");
      for (const wd of weekDays) {
        const key = wd.toDateString();
        if (!res[key]) res[key] = [];
        const match = orig.toDateString() === wd.toDateString();
        const recWeekly = appt.recurrence === "weekly" && wd.getDay() === orig.getDay() && wd > orig;
        const recDaily = appt.recurrence === "daily" && wd > orig;
        const recMonthly = appt.recurrence === "monthly" && wd.getDate() === orig.getDate() && wd > orig;
        if ((match || recWeekly || recDaily || recMonthly) && !res[key].find(x => x.id === appt.id)) res[key].push(appt);
      }
    }
    return res;
  }, [rawAppts, weekStart]);

  const relevantTasks = taskCatFilter === "all" ? tasks : tasks.filter(t => t.categoryId === taskCatFilter);
  const overdueTasks = relevantTasks.filter(t => !t.done && t.dueDate && t.dueDate < todayStr());
  const done = tasks.filter(t => t.done).length;
  const total = tasks.length;
  const pct = total ? Math.round((done / total) * 100) : 0;
  const visibleNotes = (selFolderId ? notes.filter(n => n.folderId === selFolderId) : notes).sort((a, b) => b.createdAt - a.createdAt);

  // ── Shared tab content ─────────────────────────────────────────────────────
  const tabContent = (
    <>
      {/* SEARCH RESULTS */}
      {searchOpen && searchQuery.trim() && searchResults && (
        <div>
          {searchResults.tasks.length === 0 && searchResults.appts.length === 0 && searchResults.notes.length === 0 && (
            <div style={{ textAlign: "center", padding: "40px 0", color: C.muted }}>
              <div style={{ fontSize: 24, marginBottom: 8 }}>∅</div>
              <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: 2 }}>NO RESULTS</div>
            </div>
          )}
          {searchResults.tasks.length > 0 && (
            <div style={{ marginBottom: 16 }}>
              <SectionHeader icon="⊡" label="TASKS" color={C.accent} />
              {searchResults.tasks.map(t => <TaskCard key={t.id} task={t} categories={categories} onToggle={toggleTask} onDelete={deleteTask} onEdit={openEditTask} onToggleSubtask={toggleSubtask} onAddSubtask={addSubtask} />)}
            </div>
          )}
          {searchResults.appts.length > 0 && (
            <div style={{ marginBottom: 16 }}>
              <SectionHeader icon="📅" label="APPOINTMENTS" color={C.green} />
              {searchResults.appts.map(a => <ApptCard key={a.id} appt={a} onDelete={deleteAppt} onEdit={openEditAppt} />)}
            </div>
          )}
          {searchResults.notes.length > 0 && (
            <div style={{ marginBottom: 16 }}>
              <SectionHeader icon="≡" label="NOTES" color={C.amber} />
              {searchResults.notes.map(n => {
                const folder = folders.find(f => f.id === n.folderId);
                return (
                  <div key={n.id} onClick={() => { setTab("notes"); setNoteView("list"); setSearchOpen(false); setSearchQuery(""); openEditNote(n); }} style={{ background: C.bg2, borderRadius: 12, padding: "12px 14px", marginBottom: 8, border: `1px solid ${C.border}`, borderLeft: `2px solid ${folder?.color ?? C.amber}`, cursor: "pointer" }}>
                    <div style={{ fontWeight: 700, fontSize: 13, color: C.text }}>{n.title}</div>
                    <div style={{ fontSize: 9, color: folder?.color ?? C.muted, fontWeight: 700, letterSpacing: 1, marginTop: 3 }}>{folder?.name ?? "General"}</div>
                    {n.content && <div style={{ fontSize: 11, color: C.muted, marginTop: 4, overflow: "hidden", display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical" } as React.CSSProperties}>{n.content}</div>}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* TASKS TAB */}
      {!searchOpen && tab === "tasks" && (
        <div>
          <div style={{ display: "flex", gap: 6, marginBottom: 10, flexWrap: "wrap", alignItems: "center" }}>
            <CatPill label="ALL" active={taskCatFilter === "all"} color={C.accent} onClick={() => setTaskCatFilter("all")} />
            {categories.map(cat => <CatPill key={cat.id} label={cat.name.toUpperCase()} active={taskCatFilter === cat.id} color={cat.color} onClick={() => setTaskCatFilter(cat.id)} />)}
            <button onClick={() => setShowCatMgr(!showCatMgr)} style={{ padding: "4px 8px", borderRadius: 20, border: `1px dashed ${C.dim}`, background: "transparent", cursor: "pointer", color: C.dim, fontWeight: 700, fontSize: 9, fontFamily: "inherit" }}>⚙</button>
          </div>
          {showCatMgr && (
            <div style={{ background: C.bg2, borderRadius: 14, padding: 14, border: `1px solid ${C.border}`, marginBottom: 12 }}>
              <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 3, color: C.accent, marginBottom: 10 }}>// CATEGORIES</div>
              {categories.map(cat => (
                <div key={cat.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <div style={{ width: 10, height: 10, borderRadius: "50%", background: cat.color }} />
                    <span style={{ fontSize: 12, color: C.text }}>{cat.name}</span>
                  </div>
                  <button onClick={() => deleteCategory(cat.id)} style={{ background: "none", border: "none", color: C.red, cursor: "pointer", fontSize: 16, fontWeight: 700, opacity: ["personal","work","college"].includes(cat.id) ? 0.2 : 1, pointerEvents: ["personal","work","college"].includes(cat.id) ? "none" : "auto" }}>×</button>
                </div>
              ))}
              <div style={{ display: "flex", gap: 6, marginTop: 10, alignItems: "center" }}>
                <input placeholder="New category" value={catDraft.name} onChange={e => setCatDraft(d => ({ ...d, name: e.target.value }))} onKeyDown={e => e.key === "Enter" && addCategory()} style={{ ...inp, flex: 1, padding: "7px 10px", fontSize: 12 }} />
                <div style={{ display: "flex", gap: 3 }}>{ACCENT_COLORS.slice(0, 5).map(c => <button key={c} onClick={() => setCatDraft(d => ({ ...d, color: c }))} style={{ width: 18, height: 18, borderRadius: 4, background: c, border: "none", cursor: "pointer", outline: catDraft.color === c ? `2px solid white` : "none", outlineOffset: 1 }} />)}</div>
                <button onClick={addCategory} style={{ padding: "7px 10px", borderRadius: 8, border: "none", background: C.accent, color: C.bg0, fontWeight: 700, fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>+</button>
              </div>
            </div>
          )}
          {overdueTasks.length > 0 && (
            <div style={{ marginBottom: 16 }}>
              <SectionHeader icon="⚠" label="OVERDUE" color={C.red} />
              {overdueTasks.map(t => <TaskCard key={t.id} task={t} categories={categories} onToggle={toggleTask} onDelete={deleteTask} onEdit={openEditTask} onToggleSubtask={toggleSubtask} onAddSubtask={addSubtask} />)}
            </div>
          )}
          {["high","medium","low"].map(pri => {
            const list = relevantTasks.filter(t => t.priority === pri && !t.done && !(t.dueDate && t.dueDate < todayStr()));
            if (!list.length) return null;
            const p = PRIORITY[pri];
            return (
              <div key={pri} style={{ marginBottom: 16 }}>
                <SectionHeader icon={p.icon} label={`${p.label} PRIORITY`} color={p.color} />
                {list.map(t => <TaskCard key={t.id} task={t} categories={categories} onToggle={toggleTask} onDelete={deleteTask} onEdit={openEditTask} onToggleSubtask={toggleSubtask} onAddSubtask={addSubtask} />)}
              </div>
            );
          })}
          {relevantTasks.filter(t => t.done).length > 0 && (
            <div style={{ marginBottom: 16 }}>
              <SectionHeader icon="✓" label="DONE" color={C.dim} />
              {relevantTasks.filter(t => t.done).map(t => <TaskCard key={t.id} task={t} categories={categories} onToggle={toggleTask} onDelete={deleteTask} onEdit={openEditTask} onToggleSubtask={toggleSubtask} onAddSubtask={addSubtask} />)}
            </div>
          )}
          {relevantTasks.filter(t => !t.done).length === 0 && !overdueTasks.length && (
            <div style={{ textAlign: "center", padding: "40px 0", color: C.muted }}>
              <div style={{ fontSize: 36, marginBottom: 12 }}>[ ]</div>
              <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 2 }}>NO TASKS YET</div>
            </div>
          )}
          {showTaskForm ? (
            <div style={{ background: C.bg2, borderRadius: 16, padding: 16, border: `1px solid ${C.border}`, marginTop: 8 }}>
              <input autoFocus placeholder="What needs to get done?" value={taskDraft.text} onChange={e => setTaskDraft(d => ({ ...d, text: e.target.value }))} onKeyDown={e => e.key === "Enter" && saveTask()} style={{ ...inp, marginBottom: 8 }} />
              <textarea placeholder="Description (optional)" value={taskDraft.description} onChange={e => setTaskDraft(d => ({ ...d, description: e.target.value }))} rows={2} style={{ ...inp, resize: "none", marginBottom: 8 }} />
              <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                <input type="date" value={taskDraft.dueDate} onChange={e => setTaskDraft(d => ({ ...d, dueDate: e.target.value }))} style={{ ...inp, flex: 1, fontSize: 12 }} />
                <button onClick={() => setTaskDraft(d => ({ ...d, dueDate: "" }))} style={{ padding: "0 10px", borderRadius: 8, border: `1px solid ${C.border}`, background: "transparent", cursor: "pointer", color: C.muted, fontWeight: 700, fontSize: 11, fontFamily: "inherit", whiteSpace: "nowrap" }}>No date</button>
              </div>
              <ImageUploadBtn value={taskDraft.imageUrl} onChange={url => setTaskDraft(d => ({ ...d, imageUrl: url }))} />
              <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 2, color: C.muted, marginBottom: 6 }}>PRIORITY</div>
              <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
                {Object.entries(PRIORITY).map(([k, p]) => (
                  <button key={k} onClick={() => setTaskDraft(d => ({ ...d, priority: k }))} style={{ flex: 1, padding: "6px 0", borderRadius: 8, cursor: "pointer", border: taskDraft.priority === k ? `1px solid ${p.color}` : `1px solid ${C.border}`, background: taskDraft.priority === k ? p.bg : C.bg3, fontWeight: 700, fontSize: 10, fontFamily: "inherit", color: taskDraft.priority === k ? p.color : C.muted, letterSpacing: 1 }}>{p.icon} {p.label}</button>
                ))}
              </div>
              <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 2, color: C.muted, marginBottom: 6 }}>CATEGORY</div>
              <div style={{ display: "flex", gap: 6, marginBottom: 12, flexWrap: "wrap" }}>
                {categories.map(cat => <button key={cat.id} onClick={() => setTaskDraft(d => ({ ...d, categoryId: cat.id }))} style={{ padding: "5px 10px", borderRadius: 20, border: taskDraft.categoryId === cat.id ? `1px solid ${cat.color}` : `1px solid ${C.border}`, background: taskDraft.categoryId === cat.id ? cat.color + "22" : "transparent", cursor: "pointer", fontWeight: 700, fontSize: 9, fontFamily: "inherit", color: taskDraft.categoryId === cat.id ? cat.color : C.muted, letterSpacing: 1 }}>{cat.name.toUpperCase()}</button>)}
              </div>
              {taskDraft.subtasks.length > 0 && (
                <div style={{ marginBottom: 10 }}>
                  <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 2, color: C.muted, marginBottom: 6 }}>SUBTASKS</div>
                  {taskDraft.subtasks.map((s, i) => (
                    <div key={s.id} style={{ display: "flex", gap: 6, marginBottom: 6, alignItems: "center" }}>
                      <span style={{ color: C.accent, fontWeight: 700, fontSize: 14, flexShrink: 0 }}>·</span>
                      <input placeholder={`Step ${i + 1}`} value={s.text} onChange={e => updateSubtaskInDraft(s.id, e.target.value)} style={{ ...inp, flex: 1, padding: "6px 10px", fontSize: 12 }} />
                      <button onClick={() => removeSubtaskFromDraft(s.id)} style={{ background: "none", border: "none", color: C.red, cursor: "pointer", fontSize: 16, fontWeight: 700 }}>×</button>
                    </div>
                  ))}
                </div>
              )}
              <button onClick={addSubtaskToDraft} style={{ padding: "6px 12px", borderRadius: 8, border: `1px dashed ${C.dim}`, background: "transparent", cursor: "pointer", color: C.muted, fontWeight: 700, fontSize: 10, fontFamily: "inherit", letterSpacing: 1, marginBottom: 12 }}>+ ADD SUBTASK</button>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => { setShowTaskForm(false); setEditingTaskId(null); }} style={{ flex: 1, padding: 10, borderRadius: 10, border: `1px solid ${C.border}`, background: "transparent", cursor: "pointer", fontWeight: 700, fontFamily: "inherit", color: C.muted, fontSize: 11, letterSpacing: 1 }}>CANCEL</button>
                <button onClick={saveTask} style={{ flex: 2, padding: 10, borderRadius: 10, border: "none", background: C.accent, color: C.bg0, cursor: "pointer", fontWeight: 700, fontSize: 11, fontFamily: "inherit", letterSpacing: 1, boxShadow: `0 0 16px ${C.accent}44` }}>{editingTaskId ? "SAVE CHANGES" : "+ ADD TASK"}</button>
              </div>
            </div>
          ) : (
            <button onClick={openAddTask} style={{ width: "100%", padding: 13, borderRadius: 12, border: `1px dashed ${C.dim}`, background: "transparent", cursor: "pointer", fontWeight: 700, fontSize: 11, color: C.muted, fontFamily: "inherit", letterSpacing: 2, marginTop: 8 }}>+ ADD TASK</button>
          )}
        </div>
      )}

      {/* CALENDAR TAB */}
      {!searchOpen && tab === "calendar" && (
        <div>
          <div style={{ display: "flex", gap: 4, marginBottom: 14, background: C.bg2, borderRadius: 10, padding: 3, border: `1px solid ${C.border}` }}>
            {([ ["grid","⊞ MONTH"], ["week","≡ WEEK"], ["list","↓ LIST"] ] as [string,string][]).map(([key, label]) => (
              <button key={key} onClick={() => setCalView(key as any)} style={{ flex: 1, padding: "7px 0", borderRadius: 8, border: "none", cursor: "pointer", fontWeight: 700, fontSize: 9, letterSpacing: 1, fontFamily: "inherit", background: calView === key ? C.accent : "transparent", color: calView === key ? C.bg0 : C.muted, boxShadow: calView === key ? `0 0 10px ${C.accent}55` : "none" }}>{label}</button>
            ))}
          </div>
          {calView === "grid" && (
            <>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
                <button onClick={prevMonth} style={{ width: 36, height: 36, borderRadius: 10, border: `1px solid ${C.border}`, background: C.bg2, cursor: "pointer", fontSize: 16, color: C.text }}>‹</button>
                <div style={{ fontWeight: 700, fontSize: 14, color: C.text, letterSpacing: 3 }}>{MONTHS[calMonth]} {calYear}</div>
                <button onClick={nextMonth} style={{ width: 36, height: 36, borderRadius: 10, border: `1px solid ${C.border}`, background: C.bg2, cursor: "pointer", fontSize: 16, color: C.text }}>›</button>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", marginBottom: 6 }}>
                {DAYS_S.map((d, i) => <div key={i} style={{ textAlign: "center", fontSize: 9, fontWeight: 700, color: i === 0 || i === 6 ? C.muted : C.dim, letterSpacing: 1, padding: "4px 0" }}>{d}</div>)}
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 4 }}>
                {Array.from({ length: firstDay }).map((_, i) => <div key={"e"+i} />)}
                {Array.from({ length: daysInMonth }).map((_, i) => {
                  const day = i + 1;
                  const isToday = day === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear();
                  const isSel = selDay === day;
                  return (
                    <button key={day} onClick={() => setSelDay(isSel ? null : day)} style={{ aspectRatio: "1", borderRadius: 10, border: "none", background: isSel ? C.accent : isToday ? C.bg4 : C.bg2, color: isSel ? C.bg0 : isToday ? C.accent : C.text, fontWeight: isSel || isToday ? 800 : 500, fontSize: 12, cursor: "pointer", fontFamily: "inherit", outline: isToday && !isSel ? `1px solid ${C.accent}66` : "none", boxShadow: isSel ? `0 0 14px ${C.accent}66` : "none", position: "relative" }}>
                      {day}
                      {apptsByDay[day] && !isSel && (
                        <div style={{ position: "absolute", bottom: 3, left: "50%", transform: "translateX(-50%)", display: "flex", gap: 2 }}>
                          {(apptsByDay[day] || []).slice(0, 3).map((a, idx) => <div key={idx} style={{ width: 3, height: 3, borderRadius: "50%", background: a.color, boxShadow: `0 0 4px ${a.color}` }} />)}
                        </div>
                      )}
                    </button>
                  );
                })}

              {!selDay && (
                <div style={{ marginTop: 18 }}>
                  <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 3, color: C.muted, marginBottom: 10 }}>// UPCOMING</div>
                  {appts.filter(a => a.date && new Date(a.date + "T12:00:00") >= new Date(today.toDateString())).sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime()).slice(0, 5).map(a => <ApptCard key={a.id} appt={a} onDelete={deleteAppt} onEdit={openEditAppt} />)}
                  {appts.length === 0 && <div style={{ fontSize: 11, color: C.muted, padding: "12px 0" }}>No appointments added.</div>}
                </div>
              )}
            </>
          )}
          {calView === "week" && (
            <>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                <button onClick={() => { setWeekStart(d => { const n = new Date(d); n.setDate(n.getDate()-7); return n; }); setSelWeekDay(null); }} style={{ width: 36, height: 36, borderRadius: 10, border: `1px solid ${C.border}`, background: C.bg2, cursor: "pointer", fontSize: 16, color: C.text }}>‹</button>
                <div style={{ fontWeight: 700, fontSize: 12, color: C.text, letterSpacing: 2 }}>
                  {weekDays[0].toLocaleDateString([], { month: "short", day: "numeric" })} – {weekDays[6].toLocaleDateString([], { month: "short", day: "numeric" })}

                <button onClick={() => { setWeekStart(d => { const n = new Date(d); n.setDate(n.getDate()+7); return n; }); setSelWeekDay(null); }} style={{ width: 36, height: 36, borderRadius: 10, border: `1px solid ${C.border}`, background: C.bg2, cursor: "pointer", fontSize: 16, color: C.text }}>›</button>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: 4, marginBottom: 14 }}>
                {weekDays.map((wd, i) => {
                  const isToday = wd.toDateString() === today.toDateString();
                  const isSel = selWeekDay?.toDateString() === wd.toDateString();
                  const dayAppts = weekApptsByDay[wd.toDateString()] ?? [];
                  return (
                    <button key={i} onClick={() => setSelWeekDay(isSel ? null : wd)} style={{ borderRadius: 12, border: "none", background: isSel ? C.accent : isToday ? C.bg4 : C.bg2, cursor: "pointer", fontFamily: "inherit", padding: "8px 0", display: "flex", flexDirection: "column", alignItems: "center", gap: 4, outline: isToday && !isSel ? `1px solid ${C.accent}66` : "none", boxShadow: isSel ? `0 0 12px ${C.accent}66` : "none" }}>
                      <div style={{ fontSize: 8, fontWeight: 700, color: isSel ? C.bg0 : C.dim, letterSpacing: 1 }}>{DAYS_L[i].slice(0,3)}</div>
                      <div style={{ fontSize: 15, fontWeight: 800, color: isSel ? C.bg0 : isToday ? C.accent : C.text }}>{wd.getDate()}</div>
                      <div style={{ display: "flex", gap: 2 }}>
                        {dayAppts.slice(0, 3).map((a, idx) => <div key={idx} style={{ width: 4, height: 4, borderRadius: "50%", background: isSel ? C.bg0 : a.color }} />)}
                      </div>
                    </button>
                  );
                })}
              </div>
              {selWeekDay && (
                <div>
                  <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 3, color: C.accent, marginBottom: 10 }}>
                    // {DAYS_L[selWeekDay.getDay()]} {selWeekDay.toLocaleDateString([], { month: "short", day: "numeric" })}
                  </div>
                  {(weekApptsByDay[selWeekDay.toDateString()] ?? []).length === 0
                    ? <div style={{ fontSize: 11, color: C.muted, padding: "12px 0" }}>No events this day.</div>
                    : (weekApptsByDay[selWeekDay.toDateString()] ?? []).map(a => <ApptCard key={a.id} appt={a} onDelete={deleteAppt} onEdit={openEditAppt} />)}
                </div>
              )}
              {!selWeekDay && <div style={{ fontSize: 11, color: C.muted, padding: "12px 0", letterSpacing: 1 }}>Tap a day to see its events.</div>}
            </>
          )}
          {calView === "list" && (
            <div>
              <div style={{ marginBottom: 14 }}>
                <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 3, color: C.muted, marginBottom: 8 }}>// FILTER BY COLOR</div>
                <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
                  {ACCENT_COLORS.map(c => {
                    if (!appts.some(a => a.color === c)) return null;
                    const active = apptColorFilter.has(c);
                    return <button key={c} onClick={() => toggleColorFilter(c)} style={{ width: 28, height: 28, borderRadius: 8, background: c, border: "none", cursor: "pointer", outline: active ? `2px solid white` : "2px solid transparent", outlineOffset: 2, opacity: active ? 1 : 0.3 }} />;
                  })}
                  {apptColorFilter.size > 0 && <button onClick={() => setApptColorFilter(new Set())} style={{ padding: "4px 10px", borderRadius: 8, border: `1px solid ${C.border}`, background: "transparent", cursor: "pointer", color: C.muted, fontWeight: 700, fontSize: 9, fontFamily: "inherit" }}>CLEAR</button>}
                </div>
              </div>
              {filteredAppts.sort((a, b) => new Date(a.date).getTime() - new Date(b.date).getTime()).map(a => <ApptCard key={a.id} appt={a} onDelete={deleteAppt} onEdit={openEditAppt} />)}
              {filteredAppts.length === 0 && <div style={{ textAlign: "center", padding: "40px 0", color: C.muted }}><div style={{ fontSize: 28, marginBottom: 10 }}>[ ]</div><div style={{ fontSize: 11, fontWeight: 700, letterSpacing: 2 }}>NO APPOINTMENTS</div></div>}
            </div>
          )}
          {showApptForm ? (
            <div style={{ background: C.bg2, borderRadius: 16, padding: 16, border: `1px solid ${C.border}`, marginTop: 14 }}>
              <input autoFocus placeholder="Event title" value={apptDraft.title} onChange={e => setApptDraft(d => ({ ...d, title: e.target.value }))} style={{ ...inp, marginBottom: 8 }} />

              <ImageUploadBtn value={apptDraft.imageUrl} onChange={url => setApptDraft(d => ({ ...d, imageUrl: url }))} />
              <div style={{ display: "flex", gap: 8, marginBottom: 8 }}>
                <input type="date" value={apptDraft.date} onChange={e => setApptDraft(d => ({ ...d, date: e.target.value }))} style={{ ...inp, flex: 1 }} />
                <input type="time" value={apptDraft.time} onChange={e => setApptDraft(d => ({ ...d, time: e.target.value }))} style={{ ...inp, flex: 1 }} />

                  <button key={r} onClick={() => setApptDraft(d => ({ ...d, recurrence: r }))} style={{ flex: 1, padding: "6px 0", borderRadius: 8, border: apptDraft.recurrence === r ? `1px solid ${C.accent}` : `1px solid ${C.border}`, background: apptDraft.recurrence === r ? C.accent + "22" : C.bg3, cursor: "pointer", fontWeight: 700, fontSize: 8, fontFamily: "inherit", color: apptDraft.recurrence === r ? C.accent : C.muted, letterSpacing: 0.5 }}>{r === "none" ? "ONCE" : r.toUpperCase()}</button>

              </div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 12 }}>
                {ACCENT_COLORS.map(c => <button key={c} onClick={() => setApptDraft(d => ({ ...d, color: c }))} style={{ width: 26, height: 26, borderRadius: 6, background: c, border: "none", cursor: "pointer", outline: apptDraft.color === c ? `2px solid ${c}` : "2px solid transparent", outlineOffset: 2, opacity: apptDraft.color === c ? 1 : 0.4 }} />)}
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => { setShowApptForm(false); setEditingApptId(null); }} style={{ flex: 1, padding: 10, borderRadius: 10, border: `1px solid ${C.border}`, background: "transparent", cursor: "pointer", fontWeight: 700, fontFamily: "inherit", color: C.muted, fontSize: 11, letterSpacing: 1 }}>CANCEL</button>
                <button onClick={saveAppt} style={{ flex: 2, padding: 10, borderRadius: 10, border: "none", background: C.green, color: C.bg0, cursor: "pointer", fontWeight: 700, fontSize: 11, fontFamily: "inherit", letterSpacing: 1, boxShadow: `0 0 16px ${C.green}44` }}>{editingApptId ? "SAVE CHANGES" : "+ ADD EVENT"}</button>
              </div>
            </div>
          ) : (
            <button onClick={openAddAppt} style={{ width: "100%", padding: 13, borderRadius: 12, border: `1px dashed ${C.dim}`, background: "transparent", cursor: "pointer", fontWeight: 700, fontSize: 11, color: C.muted, fontFamily: "inherit", letterSpacing: 2, marginTop: 14 }}>+ ADD EVENT</button>

        </div>

            <>

              </div>
              {showFolderMgr && (
                <div style={{ background: C.bg2, borderRadius: 14, padding: 14, border: `1px solid ${C.border}`, marginBottom: 12 }}>
                  <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 3, color: C.accent, marginBottom: 10 }}>// FOLDERS</div>
                  {folders.map(f => (
                    <div key={f.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>

                    <input placeholder="New folder" value={folderDraft.name} onChange={e => setFolderDraft(d => ({ ...d, name: e.target.value }))} onKeyDown={e => e.key === "Enter" && addFolder()} style={{ ...inp, flex: 1, padding: "7px 10px", fontSize: 12 }} />

                    <button onClick={addFolder} style={{ padding: "7px 10px", borderRadius: 8, border: "none", background: C.accent, color: C.bg0, fontWeight: 700, fontSize: 12, cursor: "pointer", fontFamily: "inherit" }}>+</button>
                  </div>
                </div>
              )}
              {visibleNotes.map(n => {
                const folder = folders.find(f => f.id === n.folderId);
                return (
                  <div key={n.id} onClick={() => openEditNote(n)} style={{ background: C.bg2, borderRadius: 12, padding: "12px 14px", marginBottom: 8, border: `1px solid ${C.border}`, borderLeft: `2px solid ${folder?.color ?? C.accent}`, cursor: "pointer" }}>
                    <div style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ fontWeight: 700, fontSize: 13, color: C.text, marginBottom: 4 }}>{n.title}</div>
                        <div style={{ fontSize: 9, color: folder?.color ?? C.muted, fontWeight: 700, letterSpacing: 1, marginBottom: 6 }}>{n.type === "topic" ? "◈ TOPIC" : "≡ TEXT"} · {folder?.name ?? "General"}</div>
                        {n.type === "descriptive" && n.content && <div style={{ fontSize: 11, color: C.muted, lineHeight: 1.5, overflow: "hidden", display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical" } as React.CSSProperties}>{n.content}</div>}
                        {n.type === "topic" && n.topics.length > 0 && <div style={{ fontSize: 11, color: C.muted }}>{n.topics.slice(0, 2).map((t, i) => <div key={i} style={{ marginBottom: 2 }}>· {t}</div>)}{n.topics.length > 2 && <div style={{ color: C.dim }}>+{n.topics.length - 2} more</div>}</div>}
                      </div>
                      <div style={{ display: "flex", flexDirection: "column", alignItems: "flex-end", gap: 6, flexShrink: 0 }}>
                        {n.imageUrl && <img src={n.imageUrl} alt="" style={{ width: 46, height: 46, borderRadius: 8, objectFit: "cover" }} />}
                        <button onClick={e => { e.stopPropagation(); deleteNote(n.id); }} style={{ background: "#FF44441A", border: "none", borderRadius: 6, width: 26, height: 26, cursor: "pointer", color: C.red, fontWeight: 700, fontSize: 13 }}>×</button>
                      </div>
                    </div>
                  </div>
                );
              })}
              {visibleNotes.length === 0 && <div style={{ textAlign: "center", padding: "40px 0", color: C.muted }}><div style={{ fontSize: 32, marginBottom: 10 }}>≡</div><div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 2 }}>NO NOTES YET</div></div>}
              <button onClick={openAddNote} style={{ width: "100%", padding: 13, borderRadius: 12, border: `1px dashed ${C.dim}`, background: "transparent", cursor: "pointer", fontWeight: 700, fontSize: 11, color: C.muted, fontFamily: "inherit", letterSpacing: 2, marginTop: 8 }}>+ NEW NOTE</button>
            </>
          ) : (
            <div>
              <button onClick={() => { setNoteView("list"); setEditingNoteId(null); }} style={{ background: "transparent", border: "none", color: C.accent, fontSize: 11, fontWeight: 700, fontFamily: "inherit", cursor: "pointer", letterSpacing: 1, marginBottom: 14, padding: 0 }}>← BACK</button>
              <input placeholder="Note title" value={noteDraft.title} onChange={e => setNoteDraft(d => ({ ...d, title: e.target.value }))} style={{ ...inp, marginBottom: 10, fontSize: 15, fontWeight: 700 }} />
              <div style={{ display: "flex", gap: 4, marginBottom: 10, background: C.bg2, borderRadius: 10, padding: 3, border: `1px solid ${C.border}` }}>
                {([ ["descriptive","≡ DESCRIPTIVE"], ["topic","◈ TOPICS"] ] as ["descriptive"|"topic", string][]).map(([key, label]) => (
                  <button key={key} onClick={() => setNoteDraft(d => ({ ...d, type: key }))} style={{ flex: 1, padding: "7px 0", borderRadius: 8, border: "none", cursor: "pointer", fontWeight: 700, fontSize: 10, letterSpacing: 1, fontFamily: "inherit", background: noteDraft.type === key ? C.amber : "transparent", color: noteDraft.type === key ? C.bg0 : C.muted }}>{label}</button>
                ))}
              </div>
              <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 2, color: C.muted, marginBottom: 6 }}>FOLDER</div>
              <div style={{ display: "flex", gap: 6, marginBottom: 10, flexWrap: "wrap" }}>
                {folders.map(f => <button key={f.id} onClick={() => setNoteDraft(d => ({ ...d, folderId: f.id }))} style={{ padding: "5px 10px", borderRadius: 20, border: noteDraft.folderId === f.id ? `1px solid ${f.color}` : `1px solid ${C.border}`, background: noteDraft.folderId === f.id ? f.color + "22" : "transparent", cursor: "pointer", fontWeight: 700, fontSize: 9, fontFamily: "inherit", color: noteDraft.folderId === f.id ? f.color : C.muted, letterSpacing: 1 }}>{f.name.toUpperCase()}</button>)}
              </div>
              {noteDraft.type === "descriptive" ? (
                <textarea placeholder="Write your note here..." value={noteDraft.content} onChange={e => setNoteDraft(d => ({ ...d, content: e.target.value }))} rows={8} style={{ ...inp, resize: "none", marginBottom: 10, lineHeight: 1.7 }} />
              ) : (
                <div style={{ marginBottom: 10 }}>
                  <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 2, color: C.muted, marginBottom: 8 }}>Press Enter to add · Backspace on empty to remove</div>
                  {noteDraft.topics.map((topic, i) => (
                    <div key={i} style={{ display: "flex", gap: 6, marginBottom: 6, alignItems: "center" }}>
                      <span style={{ color: C.amber, fontWeight: 700, fontSize: 16, flexShrink: 0, lineHeight: 1 }}>·</span>
                      <input placeholder={`Topic ${i + 1}`} value={topic} onChange={e => { const t = [...noteDraft.topics]; t[i] = e.target.value; setNoteDraft(d => ({ ...d, topics: t })); }}
                        onKeyDown={e => {
                          if (e.key === "Enter") { e.preventDefault(); const t = [...noteDraft.topics]; t.splice(i+1, 0, ""); setNoteDraft(d => ({ ...d, topics: t })); }
                          if (e.key === "Backspace" && !topic && noteDraft.topics.length > 1) { e.preventDefault(); setNoteDraft(d => ({ ...d, topics: d.topics.filter((_, idx) => idx !== i) })); }
                        }} style={{ ...inp, flex: 1, padding: "7px 10px", fontSize: 13 }} />
                      {noteDraft.topics.length > 1 && <button onClick={() => setNoteDraft(d => ({ ...d, topics: d.topics.filter((_, idx) => idx !== i) }))} style={{ background: "none", border: "none", color: C.red, cursor: "pointer", fontSize: 18, fontWeight: 700, lineHeight: 1 }}>×</button>}
                    </div>
                  ))}
                  <button onClick={() => setNoteDraft(d => ({ ...d, topics: [...d.topics, ""] }))} style={{ padding: "6px 12px", borderRadius: 8, border: `1px dashed ${C.dim}`, background: "transparent", cursor: "pointer", color: C.muted, fontWeight: 700, fontSize: 10, fontFamily: "inherit", letterSpacing: 1, marginTop: 4 }}>+ ADD TOPIC</button>
                </div>
              )}
              <ImageUploadBtn value={noteDraft.imageUrl} onChange={url => setNoteDraft(d => ({ ...d, imageUrl: url }))} />
              <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
                <button onClick={() => { setNoteView("list"); setEditingNoteId(null); }} style={{ flex: 1, padding: 10, borderRadius: 10, border: `1px solid ${C.border}`, background: "transparent", cursor: "pointer", fontWeight: 700, fontFamily: "inherit", color: C.muted, fontSize: 11, letterSpacing: 1 }}>CANCEL</button>
                <button onClick={saveNote} style={{ flex: 2, padding: 10, borderRadius: 10, border: "none", background: C.amber, color: C.bg0, cursor: "pointer", fontWeight: 700, fontSize: 11, fontFamily: "inherit", letterSpacing: 1, boxShadow: `0 0 16px ${C.amber}44` }}>SAVE NOTE</button>
              </div>
            </div>
          )}
        </div>
      )}
    </>
  );

  // ── Focus banner (shared) ───────────────────────────────────────────────────
  const focusBanner = (
    <div style={{ background: C.bg2, border: `1px solid ${C.accent}33`, borderLeft: `3px solid ${C.accent}`, borderRadius: 14, padding: "12px 14px", cursor: "pointer", position: "relative", overflow: "hidden" }} onClick={!editMot ? startEditMot : undefined}>
      <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 1, background: `linear-gradient(90deg, ${C.accent}88, transparent)` }} />
      <div style={{ fontSize: 8, fontWeight: 700, letterSpacing: 3, color: C.accent, marginBottom: 4 }}>// FOCUS MODE</div>
      {editMot ? (
        <div>
          <textarea ref={motRef} value={motDraft} onChange={e => setMotDraft(e.target.value)} onClick={e => e.stopPropagation()} rows={2} style={{ ...inp, resize: "none", marginBottom: 8, border: `1px solid ${C.accent}66`, fontSize: 11 }} />
          <button onClick={e => { e.stopPropagation(); saveMot(); }} style={{ background: C.accent, color: C.bg0, border: "none", borderRadius: 8, padding: "5px 12px", fontWeight: 700, fontSize: 10, cursor: "pointer", fontFamily: "inherit", letterSpacing: 1 }}>SAVE</button>
        </div>
      ) : (
        <><div style={{ color: C.text, fontSize: 12, fontWeight: 600, lineHeight: 1.5 }}>{motivation}</div><div style={{ fontSize: 8, color: C.muted, marginTop: 4, letterSpacing: 1 }}>{isWide ? "CLICK TO EDIT" : "TAP TO EDIT"}</div></>
      )}
    </div>
  );

  // ── DESKTOP / TABLET LAYOUT (≥640px) ───────────────────────────────────────
  if (isWide) {
    return (
      <div style={{ display: "flex", height: "100vh", background: C.bg0, fontFamily: "'IBM Plex Mono','Courier New',monospace", overflow: "hidden" }}>

        {/* SIDEBAR */}
        <div style={{ width: 260, background: C.bg1, borderRight: `1px solid ${C.border}`, display: "flex", flexDirection: "column", padding: "20px 16px", overflowY: "auto", flexShrink: 0 }}>
          <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 4, color: C.accent, marginBottom: 18, paddingBottom: 14, borderBottom: `1px solid ${C.border}` }}>// ADHD PLANNER</div>

          {/* Focus banner */}
          <div style={{ marginBottom: 14 }}>{focusBanner}</div>

          {/* Progress */}
          {total > 0 && (
            <div style={{ padding: "8px 12px", background: C.bg2, borderRadius: 10, border: `1px solid ${C.border}`, marginBottom: 20 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontSize: 9, fontWeight: 700, color: C.muted, marginBottom: 5, letterSpacing: 2 }}>
                <span>TASKS</span><span style={{ color: pct === 100 ? C.green : C.accent }}>{pct}% — {done}/{total}</span>
              </div>
              <div style={{ height: 3, background: C.bg4, borderRadius: 3, overflow: "hidden" }}>
                <div style={{ height: "100%", borderRadius: 3, background: pct === 100 ? C.green : `linear-gradient(90deg, ${C.accent}, ${C.accentD})`, width: `${pct}%`, transition: "width 0.5s", boxShadow: `0 0 6px ${C.accent}88` }} />
              </div>
            </div>
          )}

          {/* Nav */}
          <div style={{ fontSize: 8, fontWeight: 700, letterSpacing: 3, color: C.dim, marginBottom: 8 }}>NAVIGATE</div>

            {([ ["tasks","⊡","TASKS"], ["calendar","📅","CALENDAR"], ["notes","≡","NOTES"] ] as [string,string,string][]).map(([key, icon, label]) => (
              <button key={key} onClick={() => { setTab(key); setSearchOpen(false); setSearchQuery(""); }} style={{ padding: "11px 14px", background: tab === key ? C.accent + "22" : "transparent", border: tab === key ? `1px solid ${C.accent}44` : `1px solid transparent`, borderRadius: 10, cursor: "pointer", fontWeight: 700, fontSize: 11, letterSpacing: 1.5, color: tab === key ? C.accent : C.muted, textAlign: "left", fontFamily: "inherit", display: "flex", gap: 10, alignItems: "center", transition: "all 0.15s" }}>
                <span>{icon}</span><span>{label}</span>
              </button>
            ))}
          </div>

          <div style={{ flex: 1 }} />
          <button onClick={() => setShowCapture(true)} style={{ width: "100%", padding: "11px 0", borderRadius: 12, border: "none", background: C.accent, color: C.bg0, fontWeight: 700, fontSize: 11, cursor: "pointer", fontFamily: "inherit", letterSpacing: 1.5, boxShadow: `0 0 20px ${C.accent}44`, marginTop: 24 }}>+ QUICK CAPTURE</button>
        </div>

        {/* MAIN AREA */}
        <div style={{ flex: 1, display: "flex", flexDirection: "column", overflow: "hidden" }}>
          {/* Top bar */}
          <div style={{ height: 52, borderBottom: `1px solid ${C.border}`, display: "flex", alignItems: "center", padding: "0 32px", gap: 12, flexShrink: 0, background: C.bg1 }}>
            <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 2, color: C.text }}>
              {tab === "tasks" ? "⊡ TASKS" : tab === "calendar" ? "📅 CALENDAR" : "≡ NOTES"}
            </div>
            <div style={{ flex: 1 }} />
            {searchOpen && (
              <input ref={searchRef} placeholder="Search tasks, notes, events..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                style={{ ...inp, width: 300, padding: "7px 14px", border: `1px solid ${C.accent}66` }} />
            )}
            <button onClick={() => { setSearchOpen(!searchOpen); setSearchQuery(""); }} style={{ width: 36, height: 36, borderRadius: 10, border: `1px solid ${searchOpen ? C.accent : C.border}`, background: searchOpen ? C.accent + "22" : C.bg2, cursor: "pointer", color: searchOpen ? C.accent : C.muted, fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center" }}>🔍</button>
          </div>

          {/* Content */}
          <div style={{ flex: 1, overflowY: "auto", padding: "28px 40px 40px", background: C.bg0 }}>
            {tabContent}
          </div>
        </div>

        {showCapture && <QuickCapture fixed categories={categories} folders={folders} onAddTask={quickAddTask} onAddNote={quickAddNote} onClose={() => setShowCapture(false)} />}
      </div>
    );
  }

  // ── PHONE LAYOUT (<640px) ──────────────────────────────────────────────────
  return (
    <div style={{ minHeight: "100dvh", width: "100%", background: C.bg1, display: "flex", flexDirection: "column", position: "relative", fontFamily: "'IBM Plex Mono','Courier New',monospace", overflow: "hidden" }}>

        {/* Motivation banner */}
        <div style={{ margin: "8px 16px 0", background: C.bg2, border: `1px solid ${C.accent}33`, borderLeft: `3px solid ${C.accent}`, borderRadius: 14, padding: "12px 16px", cursor: "pointer", position: "relative", overflow: "hidden" }} onClick={!editMot ? startEditMot : undefined}>
          <div style={{ position: "absolute", top: 0, left: 0, right: 0, height: 1, background: `linear-gradient(90deg, ${C.accent}88, transparent)` }} />
          <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: 3, color: C.accent, textTransform: "uppercase", marginBottom: 4 }}>// FOCUS MODE</div>
          {editMot ? (
            <div>
              <textarea ref={motRef} value={motDraft} onChange={e => setMotDraft(e.target.value)} onClick={e => e.stopPropagation()} rows={2} style={{ ...inp, resize: "none", marginBottom: 8, border: `1px solid ${C.accent}66` }} />
              <button onClick={e => { e.stopPropagation(); saveMot(); }} style={{ background: C.accent, color: C.bg0, border: "none", borderRadius: 8, padding: "6px 14px", fontWeight: 700, fontSize: 11, cursor: "pointer", fontFamily: "inherit", letterSpacing: 1 }}>SAVE</button>
            </div>
          ) : (
            <><div style={{ color: C.text, fontSize: 13, fontWeight: 600, lineHeight: 1.5 }}>{motivation}</div><div style={{ fontSize: 9, color: C.muted, marginTop: 4, letterSpacing: 1 }}>TAP TO EDIT</div></>
          )}
        </div>

        {/* Progress bar */}
        {tab === "tasks" && total > 0 && (
          <div style={{ margin: "8px 16px 0", padding: "8px 14px", background: C.bg2, borderRadius: 12, border: `1px solid ${C.border}` }}>
            <div style={{ display: "flex", justifyContent: "space-between", fontSize: 10, fontWeight: 700, color: C.muted, marginBottom: 6, letterSpacing: 2 }}>
              <span>TASKS</span><span style={{ color: pct === 100 ? C.green : C.accent }}>{pct}% — {done}/{total}</span>
            </div>
            <div style={{ height: 4, background: C.bg4, borderRadius: 4, overflow: "hidden" }}>
              <div style={{ height: "100%", borderRadius: 4, background: pct === 100 ? C.green : `linear-gradient(90deg, ${C.accent}, ${C.accentD})`, width: `${pct}%`, transition: "width 0.5s cubic-bezier(.4,2,.6,1)", boxShadow: `0 0 8px ${C.accent}88` }} />
            </div>
          </div>
        )}

        {/* Tabs + Search */}
        <div style={{ margin: "8px 16px 0", display: "flex", gap: 8, alignItems: "center" }}>
          <div style={{ flex: 1, display: "flex", background: C.bg2, borderRadius: 12, padding: 4, gap: 4, border: `1px solid ${C.border}` }}>
            {([ ["tasks","TASKS"], ["calendar","CAL"], ["notes","NOTES"] ] as [string,string][]).map(([key, label]) => (
              <button key={key} onClick={() => { setTab(key); setSearchOpen(false); setSearchQuery(""); }} style={{ flex: 1, padding: "8px 0", background: tab === key && !searchOpen ? C.accent : "transparent", border: "none", borderRadius: 9, cursor: "pointer", fontWeight: 700, fontSize: 10, letterSpacing: 1.5, color: tab === key && !searchOpen ? C.bg0 : C.muted, transition: "all 0.2s", fontFamily: "inherit", boxShadow: tab === key && !searchOpen ? `0 0 16px ${C.accent}66` : "none" }}>{label}</button>
            ))}
          </div>
          <button onClick={() => { setSearchOpen(!searchOpen); setSearchQuery(""); }} style={{ width: 38, height: 38, borderRadius: 12, border: `1px solid ${searchOpen ? C.accent : C.border}`, background: searchOpen ? C.accent + "22" : C.bg2, cursor: "pointer", color: searchOpen ? C.accent : C.muted, fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>🔍</button>
        </div>

        {/* Search bar */}
        {searchOpen && (
          <div style={{ margin: "8px 16px 0" }}>
            <input ref={searchRef} placeholder="Search tasks, notes, events..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
              style={{ ...inp, border: `1px solid ${C.accent}66` }} />
          </div>
        )}

        {/* Content */}
        <div style={{ flex: 1, overflowY: "auto", padding: "12px 16px 100px" }}>
          {tabContent}
        </div>

        {/* FAB */}
        {!showCapture && (
          <button onClick={() => setShowCapture(true)} style={{ position: "absolute", bottom: 28, right: 20, width: 50, height: 50, borderRadius: "50%", background: C.accent, border: "none", cursor: "pointer", fontSize: 26, color: C.bg0, fontWeight: 700, boxShadow: `0 0 24px ${C.accent}88`, zIndex: 100, display: "flex", alignItems: "center", justifyContent: "center", lineHeight: 1 }}>+</button>
        )}

        {/* Quick Capture Modal */}
        {showCapture && (
          <QuickCapture categories={categories} folders={folders} onAddTask={quickAddTask} onAddNote={quickAddNote} onClose={() => setShowCapture(false)} />
        )}
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch((err) => {
          console.warn("Service worker registration failed:", err);
        });
      });
    }
  </script>

</body>
</html>
